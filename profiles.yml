# Connection settings. DuckDB is a single file, so there is no password.
ecommerce_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DBT_DUCKDB_PATH lets you build into a different file (e.g. a test copy).
      path: "{{ env_var('DBT_DUCKDB_PATH', 'warehouse.duckdb') }}"
      threads: 4
